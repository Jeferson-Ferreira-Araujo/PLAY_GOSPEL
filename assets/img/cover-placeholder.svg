<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" role="img" aria-label="Capa em desenvolvimento">
  <defs>
    <linearGradient id="pgcp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <radialGradient id="pgcp-rays" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1D3A63" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pgcp-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <filter id="pgcp-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="pgcp-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1E293B"/>
    </pattern>
  </defs>

  <!-- fundo -->
  <rect width="480" height="720" rx="26" fill="url(#pgcp-bg)"/>
  <rect width="480" height="720" rx="26" fill="url(#pgcp-dots)" opacity=".5"/>
  <rect width="480" height="720" rx="26" fill="url(#pgcp-rays)"/>

  <!-- raios sutis -->
  <g stroke="#25406B" stroke-width="1" opacity=".35">
    <line x1="240" y1="300" x2="240" y2="40"/>
    <line x1="240" y1="300" x2="80" y2="120"/>
    <line x1="240" y1="300" x2="400" y2="120"/>
    <line x1="240" y1="300" x2="60" y2="300"/>
    <line x1="240" y1="300" x2="420" y2="300"/>
    <line x1="240" y1="300" x2="100" y2="470"/>
    <line x1="240" y1="300" x2="380" y2="470"/>
  </g>

  <!-- moldura com glow azul -->
  <rect x="7" y="7" width="466" height="706" rx="20" fill="none" stroke="#2563EB" stroke-width="3" opacity=".5" filter="url(#pgcp-glow)"/>
  <rect x="7" y="7" width="466" height="706" rx="20" fill="none" stroke="#7DD3FC" stroke-width="1.5" opacity=".85"/>

  <!-- círculo tracejado -->
  <circle cx="240" cy="300" r="112" fill="none" stroke="#3A4A63" stroke-width="2.5" stroke-dasharray="7 9"/>

  <!-- ícone de imagem -->
  <g transform="translate(240,296)" stroke="#7C8BA3" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <rect x="-58" y="-42" width="116" height="84" rx="10"/>
    <circle cx="24" cy="-18" r="8"/>
    <path d="M-42 24 L-10 -8 L14 14 L44 -14 L52 24 Z"/>
  </g>
  <circle cx="292" cy="352" r="22" fill="#0B1120" stroke="#7C8BA3" stroke-width="4"/>
  <path d="M292 343v18M283 352h18" stroke="#7C8BA3" stroke-width="4" stroke-linecap="round"/>

  <!-- título -->
  <text x="240" y="470" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="800" font-size="34" fill="#F1F5F9" letter-spacing="1">CAPA EM</text>
  <text x="240" y="514" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="800" font-size="34" fill="url(#pgcp-blue)" letter-spacing="1">DESENVOLVIMENTO</text>

  <!-- divisor -->
  <line x1="165" y1="545" x2="212" y2="545" stroke="#3A4A63" stroke-width="2"/>
  <circle cx="240" cy="545" r="3" fill="#3A4A63"/>
  <line x1="268" y1="545" x2="315" y2="545" stroke="#3A4A63" stroke-width="2"/>

  <!-- ícone de controle + texto -->
  <g transform="translate(178,566)" stroke="#8592A8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="0" y="4" width="36" height="22" rx="9"/>
    <line x1="9" y1="15" x2="9" y2="15"/>
    <line x1="27" y1="11" x2="27" y2="11"/>
    <line x1="31" y1="16" x2="31" y2="16"/>
    <line x1="6" y1="12" x2="6" y2="18"/>
    <line x1="3" y1="15" x2="9" y2="15"/>
  </g>
  <text x="240" y="580" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" fill="#94A3B8">EM BREVE, UMA NOVA</text>
  <text x="240" y="602" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" fill="#94A3B8">EXPERIÊNCIA PARA VOCÊ!</text>
</svg>
